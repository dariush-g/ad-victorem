<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ad Victorem</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; color: #fff7e6; user-select: none;
        font-family: 'Trajan Pro', 'Cinzel', Georgia, 'Times New Roman', serif; text-transform: uppercase;
        letter-spacing: 2px; text-shadow: 2px 2px 0 #1a1210, -1px -1px 0 #1a1210, 1px -1px 0 #1a1210, -1px 1px 0 #1a1210; }
      #rank { position: absolute; left: 28px; top: 20px; }
      #rank .title { font-size: 26px; font-weight: bold; color: #f0c050; }
      #rank .sub { font-size: 13px; opacity: 0.9; }
      .prompt b { color: #f0c050; }
      #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20, 12, 10, 0.55);
        color: #fff7e6; font-family: 'Trajan Pro', 'Cinzel', Georgia, 'Times New Roman', serif; user-select: none; }
      #menu[hidden] { display: none; }
      .menu-box { width: min(420px, calc(100vw - 32px)); padding: 26px 28px 22px; box-sizing: border-box; background: rgba(38, 24, 18, 0.94);
        border: 2px solid #b98a45; border-radius: 6px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
      .menu-box h1 { margin: 0 0 18px; text-align: center; font-size: 28px; letter-spacing: 4px; color: #f0c050; text-transform: uppercase; }
      .menu-actions { display: flex; flex-direction: column; gap: 8px; }
      .menu-actions button { font: bold 15px Georgia, serif; letter-spacing: 2px; text-transform: uppercase; color: #fff7e6; cursor: pointer;
        padding: 11px; background: rgba(240, 192, 80, 0.1); border: 1px solid #6e5334; border-radius: 4px; }
      .menu-actions button:hover { border-color: #f0c050; background: rgba(240, 192, 80, 0.22); }
      .menu-actions button[hidden], .menu-join[hidden] { display: none; }
      .menu-join { display: flex; gap: 8px; }
      .menu-join input { flex: 1; min-width: 0; font: bold 15px Georgia, serif; letter-spacing: 4px; text-transform: uppercase; text-align: center;
        color: #fff7e6; background: rgba(0, 0, 0, 0.35); border: 1px solid #6e5334; border-radius: 4px; padding: 10px; }
      .menu-join input:focus { outline: none; border-color: #f0c050; }
      .menu-join input::placeholder { letter-spacing: 1px; color: rgba(255, 247, 230, 0.45); text-transform: none; }
      .menu-join button { flex: 0 0 auto; padding: 11px 18px; }
      .menu-name { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font: 12px Georgia, serif; letter-spacing: 2px; text-transform: uppercase; color: #f0c050; }
      .menu-name input { font: bold 16px Georgia, serif; letter-spacing: 2px; text-align: center; color: #fff7e6; background: rgba(0, 0, 0, 0.35);
        border: 1px solid #6e5334; border-radius: 4px; padding: 10px; }
      .menu-name input:focus { outline: none; border-color: #f0c050; }
      .menu-name input.missing { border-color: #d8483c; }
      .menu-name input::placeholder { letter-spacing: 1px; color: rgba(255, 247, 230, 0.45); }
      #foe-name { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap; font-size: 15px; font-weight: bold;
        color: #f0c050; text-transform: none; letter-spacing: 1px; will-change: transform; }
      #foe-name[hidden] { display: none; }
      .result { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(380px, calc(100vw - 32px)); box-sizing: border-box;
        padding: 22px 24px 18px; text-align: center; pointer-events: auto; background: rgba(38, 24, 18, 0.92); border: 2px solid #b98a45;
        border-radius: 6px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); text-shadow: none; }
      .result[hidden] { display: none; }
      .result-title { font-size: 30px; font-weight: bold; letter-spacing: 4px; color: #f0c050; }
      .result-note { min-height: 18px; margin: 8px 0 16px; font: 13px Georgia, serif; letter-spacing: 0.5px; text-transform: none; }
      .result-actions { display: flex; flex-direction: column; gap: 8px; }
      .result-actions button { font: bold 14px Georgia, serif; letter-spacing: 2px; text-transform: uppercase; color: #fff7e6; cursor: pointer;
        padding: 11px; background: rgba(240, 192, 80, 0.1); border: 1px solid #6e5334; border-radius: 4px; }
      .result-actions button:hover:not(:disabled) { border-color: #f0c050; background: rgba(240, 192, 80, 0.22); }
      .result-actions button:disabled { cursor: default; opacity: 0.4; }
      .menu-box h2 { margin: 20px 0 8px; font-size: 13px; letter-spacing: 3px; color: #f0c050; text-transform: uppercase; }
      .menu-keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font: 13px Georgia, serif; }
      .menu-keys b { color: #f0c050; text-align: right; font-weight: bold; }
      .prompt, .toast { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; transition: opacity 0.2s; }
      .prompt { bottom: 76px; font-size: 17px; }
      .toast { top: 22%; font-size: 15px; }
      .prompt.show, .toast.show { opacity: 1; }
      #match { position: absolute; left: 0; right: 0; top: 64px; text-align: center; font-size: 17px; }
      #match b { color: #f0c050; }
      #foe { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); text-align: center; font-size: 12px; }
      #foe .bar { margin-top: 4px; width: 300px; }
      .inv { position: absolute; right: 6%; top: 50%; transform: translateY(-50%); pointer-events: auto; padding: 18px 22px 14px;
        background: rgba(38, 24, 18, 0.88); border: 2px solid #b98a45; border-radius: 6px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); text-shadow: none; }
      .inv[hidden] { display: none; }
      .inv-tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid #6e5334; }
      .inv-tab { padding: 6px 14px 5px; font-size: 16px; font-weight: bold; color: #b9a27a; cursor: pointer;
        border: 1px solid transparent; border-bottom: none; border-radius: 5px 5px 0 0; }
      .inv-tab:hover { color: #fff7e6; }
      .inv-tab.on { color: #f0c050; border-color: #6e5334; background: rgba(240, 192, 80, 0.12); }
      .sheet { width: 420px; }
      .sheet-figure { position: relative; border: 1px solid #6e5334; border-radius: 4px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #6a4631 0%, #3a2419 62%, #22150f 100%); }
      .sheet-figure svg, .sheet-figure canvas { position: absolute; left: 0; width: 100%; }
      .sheet-figure svg { top: 0; height: 100%; }
      .sheet-figure canvas { top: 12px; aspect-ratio: 1; }
      .stat { position: absolute; width: 132px; }
      .stat.tl, .stat.bl { left: 10px; }
      .stat.tr, .stat.br { right: 10px; text-align: right; }
      .stat.tl, .stat.tr { top: 9px; }
      .stat.bl, .stat.br { bottom: 9px; }
      .stat-name { font: bold 14px Georgia, 'Times New Roman', serif; letter-spacing: 1.5px; color: #f0c050; text-shadow: 0 1px 2px #000; }
      .stat-pips { display: flex; gap: 2px; margin: 4px 0; }
      .stat.tr .stat-pips, .stat.br .stat-pips { justify-content: flex-end; }
      .stat-pips i { width: 7px; height: 9px; background: rgba(0, 0, 0, 0.45); border: 1px solid #8a6a3a; box-sizing: border-box; }
      .stat-pips i.on { background: #f0c050; border-color: #f0c050; }
      .stat-note { font: 12px Georgia, 'Times New Roman', serif; letter-spacing: 0.4px; text-transform: none; color: #fff7e6; text-shadow: 0 1px 2px #000; }
      .sheet-live { margin-top: 10px; font: 12px Georgia, serif; letter-spacing: 1px; text-align: center; }
      .vitals { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
      .bar { position: relative; width: 230px; height: 15px; background: rgba(26, 18, 16, 0.7); border: 1px solid #1a1210;
        border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(240, 192, 80, 0.35); }
      .bar i { position: absolute; left: 0; top: 0; bottom: 0; transition: width 0.12s linear; }
      .bar span { position: absolute; inset: 0; text-align: center; font: bold 10px/15px Georgia, serif; letter-spacing: 1px; }
      .bar.hp i { background: linear-gradient(#d8483c, #96231f); }
      .bar.hp.bleeding i { animation: bleed 0.9s ease-in-out infinite; }
      @keyframes bleed { 50% { filter: brightness(1.6); } }
      .bar.sp { height: 11px; width: 200px; }
      .bar.sp span { display: none; }
      .bar.sp i { background: linear-gradient(#e9c152, #b0861f); }
      .bar.sp.winded i { background: linear-gradient(#9a8a66, #6b5f45); }
      .inv-body { display: flex; gap: 22px; }
      .inv-equip { display: grid; grid-template-columns: repeat(2, 64px); gap: 6px 8px; align-content: start; }
      .inv-slot { display: flex; flex-direction: column; align-items: center; gap: 3px; font: 10px Georgia, serif; letter-spacing: 0.5px; }
      .inv-bag { display: grid; grid-template-columns: repeat(4, 56px); gap: 8px; align-content: start; }
      .inv-cell { position: relative; width: 56px; height: 56px; box-sizing: border-box; padding: 7px; background: rgba(0, 0, 0, 0.32);
        border: 1px solid #6e5334; border-radius: 4px; }
      .inv-cell.filled { cursor: pointer; background: rgba(240, 192, 80, 0.1); }
      .inv-cell.filled:hover { border-color: #f0c050; background: rgba(240, 192, 80, 0.2); }
      .inv-equip .inv-cell { border-color: #b98a45; }
      .inv-count { position: absolute; right: 4px; bottom: 2px; font: bold 12px Georgia, serif; letter-spacing: 0; }
      .inv-info { width: 414px; min-height: 48px; margin-top: 12px; font: 13px/1.35 Georgia, serif; text-transform: none; letter-spacing: 0.3px; }
      .inv-info b { color: #f0c050; }
      .inv-help { margin-top: 6px; font-size: 10px; opacity: 0.6; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="rank"><div class="title">Servus</div><div class="sub">Slave · Wooden sword</div></div>
      <div id="foe-name" hidden></div>
      <div id="foe" hidden><span class="foe-title">Opponent</span><div class="bar hp"><i></i></div></div>
      <div id="match"></div>
      <div id="result" class="result" hidden>
        <div class="result-title"></div>
        <div class="result-note"></div>
        <div class="result-actions">
          <button data-act="rematch">Rematch</button>
          <button data-act="again">Find a new opponent</button>
          <button data-act="room">Back to the room</button>
        </div>
      </div>
    </div>
    <div id="menu" hidden>
      <div class="menu-box">
        <h1>Ad Victorem</h1>
        <label class="menu-name">Your name
          <input id="player-name" maxlength="16" placeholder="Name your gladiator" autocomplete="off" spellcheck="false" />
        </label>
        <div class="menu-actions">
          <button data-act="resume">Resume</button>
          <button data-act="search">Find opponent</button>
          <button data-act="host">Play a friend · make a code</button>
          <div class="menu-join" data-show="join">
            <input id="join-code" maxlength="8" placeholder="Friend's code" autocomplete="off" spellcheck="false" />
            <button data-act="join">Join</button>
          </div>
          <button data-act="practice">Practice</button>
        </div>
        <h2>Controls</h2>
        <div class="menu-keys">
          <b>WASD</b><span>Move</span>
          <b>Shift</b><span>Run</span>
          <b>Space</b><span>Jump</span>
          <b>Left click</b><span>Attack</span>
          <b>Mouse</b><span>Look</span>
          <b>Tab</b><span>Inventory</span>
          <b>C</b><span>Character</span>
          <b>F</b><span>Find opponent</span>
          <b>P</b><span>Practice</span>
          <b>Esc</b><span>Menu</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
